# 40 Days (English) · 40days.realglobal.org
# Static app in public/, API and scheduled jobs in netlify/functions/.
[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
