# Netlify configuration for Cloud Foundation website

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Cache control
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Pages are flat files (about.html) served at /about. Unknown URLs fall
# through to 404.html with a real 404 status, with no catch-all rewrite to
# the home page (Google treats that as a soft 404 and it hurts ad
# landing-page quality).

# The ads/ folder is internal (playbook, scripts, campaign files): never serve it.
[[redirects]]
  from = "/ads/*"
  to = "/404.html"
  status = 404
  force = true
