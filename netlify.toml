# Netlify configuration for Cloud Foundation website

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Cache control
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Old .html addresses (used in earlier canonical tags) go to the real pages.
# Unknown URLs fall through to 404.html with a real 404 status — no catch-all
# rewrite to the home page, which Google treats as a soft 404 and which hurts
# ad landing-page quality.
[[redirects]]
  from = "/:page.html"
  to = "/:page/"
  status = 301

# The ads/ folder is internal (playbook, scripts, campaign files): never serve it.
[[redirects]]
  from = "/ads/*"
  to = "/404.html"
  status = 404
  force = true
